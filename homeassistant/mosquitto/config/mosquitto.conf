# Local broker for Home Assistant (and future Zigbee2MQTT / ESPHome devices).
listener 1883
allow_anonymous false
# Created (and chowned to the mosquitto user) as described in README.md, step 2.
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Loads every *.conf in conf.d/, i.e. the HiveMQ Cloud bridge once
# conf.d/hivemq-bridge.conf.example has been copied and filled in.
include_dir /mosquitto/config/conf.d
